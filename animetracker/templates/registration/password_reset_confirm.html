{% extends "base.html" %}
{% block title %}Choose a new password · TCsMyAnime{% endblock %}
{% block content %}
<section class="auth-form-card">
  <h1 class="auth-form-header">Choose a new password</h1>
  {% if validlink %}
    <form method="post" class="auth-form-fields">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Change password</button>
    </form>
  {% else %}
    <p>This reset link is invalid or has already been used. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>
  {% endif %}
</section>
{% endblock %}
