# Render Blueprint: in the Render dashboard choose New > Blueprint and pick this repo.
# It creates the Postgres database and the web service, and wires DATABASE_URL between them.
databases:
  - name: tcsmyanime-db
    plan: free
    databaseName: tcsmyanime
    user: tcsmyanime

# Render Blueprint: web service only. The database is external (Neon), set via DATABASE_URL.
services:
  - type: web
    name: tcsmyanime
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        sync: postgresql://neondb_owner:npg_XjnDYM0ciC6U@ep-dawn-shape-a1x9szhz-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: ANIME_API
        value: anilist
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false