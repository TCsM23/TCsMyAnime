{% extends "base.html" %}
{% block title %}Reset your password · TCsMyAnime{% endblock %}
{% block content %}
<section class="auth-form-card">
  <h1 class="auth-form-header">Reset your password</h1>
  <p>Enter the email on your account and we will send a reset link.</p>
  <form method="post" class="auth-form-fields">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Send reset link</button>
  </form>
</section>
{% endblock %}
